<!DOCTYPE html>
<html>
<head>
    <title>My Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    My Exam Results
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">
    <div class="card">
        <h2>📊 Exam History</h2>
        <div id="resultsContainer"></div>
    </div>
    
    <div class="card text-center">
        <button onclick="goToDashboard()" style="background: #3498db;">Back to Dashboard</button>
    </div>
</div>

<script>
    const userEmail = localStorage.getItem("loggedInUser");
    const role = localStorage.getItem("loggedInRole");

    if (!userEmail || role !== "student") {
        alert("Please login as student");
        window.location.href = "index.html";
    }

    function loadResults() {
        const container = document.getElementById("resultsContainer");
        const userData = JSON.parse(localStorage.getItem(userEmail));
        
        container.innerHTML = "";

        if (!userData || !userData.results || userData.results.length === 0) {
            container.innerHTML = `
                <div class="result-card">
                    <p style="text-align: center;">No exam results yet. Take some exams to see your results here!</p>
                </div>
            `;
            return;
        }

        // Calculate statistics
        const totalExams = userData.results.length;
        const averageScore = userData.results.reduce((acc, r) => acc + parseFloat(r.percentage), 0) / totalExams;
        const passedExams = userData.results.filter(r => r.passed).length;

        // Show statistics
        container.innerHTML += `
            <div class="result-card" style="background: #f0f8ff;">
                <h3>📈 Your Statistics</h3>
                <p><strong>Total Exams Taken:</strong> ${totalExams}</p>
                <p><strong>Average Score:</strong> ${averageScore.toFixed(1)}%</p>
                <p><strong>Exams Passed:</strong> ${passedExams}/${totalExams}</p>
                <p><strong>Pass Rate:</strong> ${((passedExams/totalExams)*100).toFixed(1)}%</p>
            </div>
        `;

        // Show individual results
        userData.results.reverse().forEach(result => {
            const status = result.passed ? "Pass" : "Fail";
            const statusClass = result.passed ? "pass" : "fail";

            container.innerHTML += `
                <div class="result-card">
                    <h3>${result.examName}</h3>
                    <p><strong>Date:</strong> ${result.date}</p>
                    <p><strong>Score:</strong> ${result.score}/${result.total}</p>
                    <p><strong>Percentage:</strong> ${result.percentage}%</p>
                    <p><strong>Status:</strong> <span class="${statusClass}">${status}</span></p>
                </div>
            `;
        });
    }

    function goToDashboard() {
        window.location.href = "student.html";
    }

    function logout() {
        localStorage.removeItem("loggedInUser");
        localStorage.removeItem("loggedInRole");
        localStorage.removeItem("userName");
        window.location.href = "index.html";
    }

    loadResults();
</script>

</body>
</html>

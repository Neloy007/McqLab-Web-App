<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    Teacher Dashboard: <span id="teacherName"></span>
    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <!-- Create Exam Section -->
    <div class="card">
        <h2>📝 Create New Exam</h2>
        <input type="text" id="examName" placeholder="Exam Name (e.g., Kotlin Basics)" required>
        <input type="number" id="examDuration" placeholder="Duration (minutes)" min="1" value="30" required>
        <button onclick="createExam()">Create Exam</button>
    </div>

    <!-- JSON Import Section -->
    <div class="card">
        <h2>📋 Import Questions (JSON Format)</h2>
        <textarea id="jsonPasteArea" placeholder='[
  {
    "id": 1,
    "question": "Which keyword is used to declare a read-only variable in Kotlin?",
    "options": {"A":"var", "B":"val", "C":"const", "D":"let"},
    "correctAnswer": "B"
  },
  {
    "id": 2,
    "question": "What is the correct way to create a function in Kotlin?",
    "options": {"A":"function myFun()", "B":"def myFun()", "C":"fun myFun()", "D":"void myFun()"},
    "correctAnswer": "C"
  }
]'></textarea>
        <button onclick="pasteJSON()">Import JSON Questions</button>
        <button class="danger" onclick="clearQuestions()">Clear All Questions</button>

        <h3>📌 Imported Questions (<span id="questionCount">0</span>)</h3>
        <div id="questionList"></div>
    </div>

    <!-- Save Exam Section -->
    <div class="card">
        <h2>💾 Save Exam</h2>
        <button onclick="saveExam()">Save Exam to System</button>
    </div>

    <!-- Saved Exams Section -->
    <div class="card">
        <h2>📚 Your Saved Exams</h2>
        <div id="savedExams"></div>
    </div>

    <!-- Results Section -->
    <div class="card">
        <h2>📊 View Results</h2>
        <button class="view-results" onclick="goToResults()">View All Student Results</button>
    </div>

</div>

<script>
    // Check authentication
    const loggedInUser = localStorage.getItem("loggedInUser");
    const role = localStorage.getItem("loggedInRole");
    
    if (!loggedInUser || role !== "teacher") {
        alert("Please login as teacher");
        window.location.href = "index.html";
    }

    // Display teacher name
    const userData = JSON.parse(localStorage.getItem(loggedInUser));
    if (userData) {
        document.getElementById("teacherName").innerText = userData.name;
    }

    // Current exam being created
    let currentExam = { 
        name: "", 
        duration: 30, 
        questions: [],
        createdBy: loggedInUser,
        createdAt: new Date().toLocaleString()
    };

    function createExam() {
        const name = document.getElementById("examName").value.trim();
        const duration = document.getElementById("examDuration").value;

        if (!name || !duration) {
            alert("Please enter exam name and duration");
            return;
        }

        currentExam.name = name;
        currentExam.duration = parseInt(duration);
        currentExam.questions = [];

        document.getElementById("questionCount").innerText = "0";
        displayQuestions();
        alert(`Exam "${name}" created! Now import questions.`);
    }

    function pasteJSON() {
        const raw = document.getElementById("jsonPasteArea").value.trim();
        
        if (!raw) {
            alert("Please paste JSON data first");
            return;
        }

        try {
            const parsed = JSON.parse(raw);
            
            if (!Array.isArray(parsed)) {
                throw new Error("Data must be an array");
            }

            const formattedQuestions = parsed.map(q => {
                // Validate required fields
                if (!q.id || !q.question || !q.options || !q.correctAnswer) {
                    throw new Error("Missing required fields in question");
                }

                // Convert options object to array
                const optionsArr = ["A", "B", "C", "D"].map(key => q.options[key] || "");
                
                // Find correct answer index
                const answerIndex = ["A", "B", "C", "D"].indexOf(q.correctAnswer);
                
                if (answerIndex === -1) {
                    throw new Error("Invalid correctAnswer. Must be A, B, C, or D");
                }

                return {
                    id: q.id,
                    question: q.question,
                    options: optionsArr,
                    answer: answerIndex
                };
            });

            currentExam.questions = currentExam.questions.concat(formattedQuestions);
            document.getElementById("questionCount").innerText = currentExam.questions.length;
            displayQuestions();
            
            alert(`Successfully imported ${formattedQuestions.length} questions!`);
        } catch (error) {
            alert("Error parsing JSON: " + error.message);
            console.error(error);
        }
    }

    function displayQuestions() {
        const list = document.getElementById("questionList");
        list.innerHTML = "";
        
        if (currentExam.questions.length === 0) {
            list.innerHTML = "<p>No questions imported yet</p>";
            return;
        }

        currentExam.questions.forEach((q, i) => {
            list.innerHTML += `
                <div class="question-item">
                    <strong>Q${i + 1}:</strong> ${q.question}
                    <br><small>Options: ${q.options.join(" | ")}</small>
                    <br><small>Correct: Option ${String.fromCharCode(65 + q.answer)}</small>
                </div>
            `;
        });
    }

    function clearQuestions() {
        if (confirm("Are you sure you want to clear all questions?")) {
            currentExam.questions = [];
            document.getElementById("questionCount").innerText = "0";
            displayQuestions();
        }
    }

    function saveExam() {
        if (!currentExam.name) {
            alert("Please create an exam first");
            return;
        }

        if (currentExam.questions.length === 0) {
            alert("Please import at least one question");
            return;
        }

        // Generate unique exam key
        const examKey = "exam_" + currentExam.name + "_" + Date.now();
        
        // Save exam
        localStorage.setItem(examKey, JSON.stringify(currentExam));
        
        // Also save in exams list for easy access
        let exams = JSON.parse(localStorage.getItem("exams") || "[]");
        exams.push({
            key: examKey,
            name: currentExam.name,
            duration: currentExam.duration,
            questionCount: currentExam.questions.length,
            createdBy: loggedInUser,
            createdAt: new Date().toLocaleString()
        });
        localStorage.setItem("exams", JSON.stringify(exams));

        alert(`Exam "${currentExam.name}" saved successfully!`);
        
        // Reset form
        currentExam = { name: "", duration: 30, questions: [], createdBy: loggedInUser };
        document.getElementById("examName").value = "";
        document.getElementById("examDuration").value = "30";
        document.getElementById("jsonPasteArea").value = "";
        document.getElementById("questionCount").innerText = "0";
        displayQuestions();
        
        loadSavedExams();
    }

    function loadSavedExams() {
        const container = document.getElementById("savedExams");
        const exams = JSON.parse(localStorage.getItem("exams") || "[]");
        
        container.innerHTML = "";
        
        if (exams.length === 0) {
            container.innerHTML = "<p>No exams saved yet</p>";
            return;
        }

        exams.reverse().forEach(exam => {
            container.innerHTML += `
                <div class="exam-item">
                    <p>
                        <strong>${exam.name}</strong> 
                        <br>Duration: ${exam.duration} min | Questions: ${exam.questionCount}
                        <br><small>Created: ${exam.createdAt}</small>
                        <button onclick="deleteExam('${exam.key}')" class="danger">Delete</button>
                    </p>
                </div>
            `;
        });
    }

    function deleteExam(examKey) {
        if (confirm("Are you sure you want to delete this exam?")) {
            // Remove exam
            localStorage.removeItem(examKey);
            
            // Update exams list
            let exams = JSON.parse(localStorage.getItem("exams") || "[]");
            exams = exams.filter(e => e.key !== examKey);
            localStorage.setItem("exams", JSON.stringify(exams));
            
            loadSavedExams();
        }
    }

    function goToResults() {
        window.location.href = "teacher-result.html";
    }

    function logout() {
        localStorage.removeItem("loggedInUser");
        localStorage.removeItem("loggedInRole");
        localStorage.removeItem("userName");
        window.location.href = "index.html";
    }

    // Load saved exams on page load
    loadSavedExams();
</script>

</body>
</html>
